name: Auto screen main-board stocks

on:
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate close-only shortlist
        run: python scripts/screen.py --pages 60 --limit 0 --output data/latest.json
      - name: Publish latest result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/latest.json
          git diff --cached --quiet || git commit -m "data: refresh main-board shortlist"
          git push
